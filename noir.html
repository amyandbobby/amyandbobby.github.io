/* Decide, before first paint, whether the cinematic intro will run. */
(function () {
  var d = document.documentElement, q = new URLSearchParams(location.search);
  d.classList.remove('no-js');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var skip = q.has('skip') && q.get('skip') !== '0';
  var t = q.has('t') ? parseFloat(q.get('t')) : null;
  if (t !== null && !(t >= 0)) t = null;
  var gl = typeof WebGL2RenderingContext !== 'undefined';
  var meta = document.querySelector('meta[name="theme-color"]');
  var paper = function () { if (meta) meta.setAttribute('content', '#F5F3EF'); };
  window.__STD = { reduce: reduce, skip: skip, t: t };
  if (!reduce && !skip && gl) {
    d.classList.add('intro');
    /* Never a blank screen: if the WebGL module has not started (CDN down, slow), show the card. */
    var fail = window.__noirFail = function () {
      if (!window.__introRunning && d.classList.contains('intro')) { d.classList.remove('intro'); d.classList.add('fallback'); d.classList.add('played'); paper(); }
    };
    /* one deadline, measured from navigation start (a slow HTML download already counts against it) */
    var now = window.performance && performance.now ? performance.now() : 0;
    setTimeout(fail, t === null ? Math.max(600, 2400 - now) : 9000);
  } else {
    paper();   /* the card shows straight away: the browser chrome should be paper, not ink */
  }
})();

<style>
:root {
  --ink: #0E0E0E;
  --ink-2: #34312E;          /* 11.9:1 on paper */
  --ink-3: #55514C;          /* 7.3:1 on paper  */
  --paper: #F5F3EF;
  --rule: rgba(14, 14, 14, .32);
  --serif: "Bodoni Moda", "Bodoni 72", Didot, "Playfair Display", Georgia, serif;
  --sans: "Jost", "Futura", "Century Gothic", "Avenir Next", "Helvetica Neue", Arial, sans-serif;

  /* portrait / phone: the stacked save-the-date card of ref #1 */
  --pad-x: 20px;
  --pad-t: min(3.1svh, 28px);
  --pad-b: min(2.5svh, 22px);
  --date: min(22vw, 10.3svh, 112px);
  --names: min(8.6vw, 4.05svh, 46px);
  --venue: min(6.4vw, 3.15svh, 30px);
  --caps: 12px;
  --note: min(4.3vw, 2.1svh, 17px);
  --photo-h: min(38.5svh, calc((100vw - 2 * var(--pad-x)) * .74 * 1.25), 520px);
  --overlap: 1.24;           /* em of the date stack that sit over the print's faded lower half */
  --gap-1: min(1.6svh, 14px);
  --gap-2: min(2.3svh, 22px);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
body {
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
p, h1, figure { margin: 0; }
a { color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

/* ---------- The card: one viewport, no scroll ---------- */
.card {
  position: relative; z-index: 1;
  width: 100%;
  height: 100vh; height: 100svh;
  display: grid;
  /* eyebrow · partner 1 · print · date · weekday · partner 2 · place · small print */
  grid-template-rows: auto auto minmax(0, var(--photo-h)) auto auto auto auto auto;
  align-content: center;
  justify-items: center;
  text-align: center;
  padding:
    max(var(--pad-t), env(safe-area-inset-top))
    max(var(--pad-x), env(safe-area-inset-right))
    max(var(--pad-b), env(safe-area-inset-bottom))
    max(var(--pad-x), env(safe-area-inset-left));
}
html:not(.intro):not(.played) .card { animation: cardIn 1.1s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes cardIn { from { opacity: 0; } to { opacity: 1; } }

.caps {
  --ls: .3em;
  font-family: var(--sans);
  font-weight: 500;
  font-size: var(--caps);
  line-height: 1.2;
  letter-spacing: var(--ls);
  text-transform: uppercase;
  color: var(--ink-2);
  /* optical correction: tracked caps carry trailing space after the last letter */
  margin-right: calc(var(--ls) * -1);
}

.eyebrow {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  width: min(100%, 420px);
}
.eyebrow .rule { flex: 1 1 0; height: 1px; background: var(--rule); }

.names {
  font-family: var(--serif);
  font-weight: 400;
  font-size: var(--names);
  line-height: 1.08;
  letter-spacing: .005em;
  color: var(--ink);
  white-space: nowrap;
}
.names .amp { font-style: italic; font-weight: 400; padding: 0 .06em; }
.n-pair { display: none; }
.n1 { margin-top: var(--gap-1); }
.n2 { margin-top: var(--gap-1); }

.photo-row {
  margin-top: var(--gap-1);
  width: 100%; height: 100%; min-height: 0;
  display: flex; justify-content: center; align-items: flex-end;
}
.photo {
  position: relative;
  height: 100%;
  aspect-ratio: 4 / 5;
  max-width: 82%;
  overflow: hidden;
  background: #dcd9d3;
  /* portrait: crisp faces above, a calm washed-out lower half that the stacked date sits on (as in ref #1) */
  -webkit-mask-image: linear-gradient(to bottom, #000 0 42%, rgba(0,0,0,.55) 55%, rgba(0,0,0,.2) 66%, rgba(0,0,0,.07) 80%, transparent 95%);
          mask-image: linear-gradient(to bottom, #000 0 42%, rgba(0,0,0,.55) 55%, rgba(0,0,0,.2) 66%, rgba(0,0,0,.07) 80%, transparent 95%);
}
.photo img, .photo canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block;
}
.photo img { object-fit: cover; object-position: 50% 16%; }
.photo canvas { pointer-events: none; }
.intro .photo img { filter: var(--fog, brightness(1.6) contrast(.25)); }

.date {
  position: relative; z-index: 2;
  margin-top: calc(var(--date) * var(--overlap) * -1);
  font-family: var(--serif);
  font-weight: 400;
  font-size: var(--date);
  line-height: 1;
  letter-spacing: .012em;
  /* default (lining, proportional) figures: the canvas glyph sampler cannot apply OpenType
     features, so the HTML must use the font's defaults to share outlines pixel-for-pixel */
  font-variant-numeric: normal;
  font-feature-settings: normal;
  font-optical-sizing: auto;
  white-space: nowrap;
  color: var(--ink);
}
/* stacked date: 03 / · 07 · / 2027 */
.dt { display: inline-grid; grid-template-columns: 1fr auto 1fr; line-height: .86; justify-items: center; align-items: baseline; }
.dt .d1 { grid-area: 1 / 1 / 2 / 4; }
.dt .s1 { grid-area: 2 / 1; justify-self: end; padding-right: .2em; }
.dt .d2 { grid-area: 2 / 2; }
.dt .s2 { grid-area: 2 / 3; justify-self: start; padding-left: .2em; }
.dt .d3 { grid-area: 3 / 1 / 4 / 4; }
.intro .date { opacity: var(--date-o, 0); }

/* WHEN: the weekday belongs to the date, not to the place */
.when { margin-top: min(.6svh, 5px); }

/* WHERE */
.details {
  margin-top: var(--gap-2);
  display: flex; flex-direction: column; align-items: center;
  gap: min(.8svh, 7px);
}
.details::before { content: ''; width: 28px; height: 1px; background: var(--rule); margin-bottom: min(1.6svh, 14px); }
.details .venue {
  font-family: var(--serif);
  font-size: var(--venue);
  line-height: 1.1;
  letter-spacing: .01em;
  color: var(--ink);
}
.details .sep { display: none; }

.foot {
  margin-top: var(--gap-2);
  display: flex; flex-direction: column; align-items: center;
  gap: min(1.2svh, 10px);
}
.foot .hair { display: none; width: 44px; height: 1px; background: var(--rule); margin-bottom: min(.6svh, 4px); }
.foot .note {
  font-family: var(--serif);
  font-style: italic;
  font-size: var(--note);
  line-height: 1.25;
  color: var(--ink-2);
}
.links {
  display: flex; align-items: center; justify-content: center; flex-wrap: nowrap; gap: .7em;
  white-space: nowrap;
}
.links .caps { margin-right: 0; }
.links a.caps {
  --ls: .2em;
  --ul: rgba(14, 14, 14, .34);
  position: relative;
  text-decoration: none;
  padding: 6px 0 4px;
  /* the underline stops at the last letter, not at its trailing tracking */
  background: linear-gradient(var(--ul), var(--ul)) 0 100% / calc(100% - var(--ls)) 1px no-repeat;
  transition: color .3s ease;
}
.links a.caps::after { content: ''; position: absolute; inset: -10px -6px; }   /* 44px touch target, no visual weight */
.links a:hover { --ul: var(--ink); color: var(--ink); }
.links a:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
.links .dot { color: var(--ink-3); font-family: var(--serif); }
.links .cd-dot, .links .countdown { display: none; }
.countdown { color: var(--ink-3); }
.cd-row { display: block; margin-top: min(.4svh, 4px); }

@media (orientation: portrait) and (max-height: 720px) {
  .cd-row { display: none; }
}

/* ---------- Landscape / desktop: balanced editorial composition ---------- */
@media (orientation: landscape) and (min-width: 700px) {
  :root {
    --pad-x: 40px;
    --pad-t: clamp(22px, 4.2svh, 48px);
    --pad-b: clamp(18px, 3.6svh, 40px);
    --date: min(10.6vw, 17.5svh, 196px);
    --names: min(4.3vw, 7svh, 74px);
    --venue: min(2.3vw, 3.6svh, 36px);
    --caps: clamp(12px, 1.45svh, 14px);
    --note: clamp(16px, 2svh, 20px);
    --photo-h: 64svh;
    --overlap: .56;
    --gap-1: clamp(10px, 2svh, 22px);
    --gap-2: clamp(12px, 2.6svh, 28px);
  }
  .card { grid-template-rows: auto auto minmax(0, var(--photo-h)) auto auto auto auto; }
  .eyebrow { width: min(100%, 520px); gap: 20px; }
  .n1, .n2 { display: none; }
  .n-pair { display: block; margin-top: var(--gap-1); }
  .photo-row { margin-top: var(--gap-2); }
  .photo {
    max-width: 40%;
    /* a crisp rectangular print that only softens where the numerals cross it */
    -webkit-mask-image: linear-gradient(to bottom, #000 0 70%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.15) 93%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0 70%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.15) 93%, transparent 100%);
  }
  .dt { display: inline; line-height: inherit; }
  .dt .s1, .dt .s2 { padding: 0; }
  .when { margin-top: clamp(2px, .5svh, 6px); }
  /* place: venue and region hang symmetrically off a hairline on the central axis */
  .details { margin-top: var(--gap-1); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: clamp(16px, 1.8vw, 30px); width: 100%; }
  .details::before { display: none; }
  .details .venue { justify-self: end; }
  .details .region { justify-self: start; }
  .details .sep { display: block; width: clamp(28px, 3.2vw, 56px); height: 1px; background: var(--rule); }
  .foot .hair { display: block; }
  .links { gap: .9em; }
  .links a.caps { --ls: .3em; }
  .links .cd-dot, .links .countdown { display: inline; }
  .cd-row { display: none; }
}
/* very short landscape (phones held sideways) */
@media (orientation: landscape) and (max-height: 520px) {
  :root { --photo-h: 46svh; --date: min(9vw, 16svh); --names: min(4vw, 8svh); --gap-1: 6px; --gap-2: 8px; --venue: min(2.6vw, 5svh); --note: 14px; }
  .foot .hair { display: none; }
}
/* tablet portrait: room for a larger print */
@media (orientation: portrait) and (min-width: 700px) {
  :root { --photo-h: min(40svh, 520px); --caps: 13px; }
  .eyebrow { width: min(100%, 480px); }
}

/* ---------- Atmosphere ---------- */
.grain {
  position: fixed; inset: -120px; z-index: 3; pointer-events: none;
  background-repeat: repeat; background-size: 180px 180px;
  opacity: .55;
  animation: grain .9s steps(1) infinite, flicker 5.3s ease-in-out infinite;
}
@keyframes grain {
  0% { transform: translate(0, 0); } 12% { transform: translate(-37px, 21px); } 25% { transform: translate(18px, -44px); }
  37% { transform: translate(-61px, -12px); } 50% { transform: translate(43px, 33px); } 62% { transform: translate(-9px, 58px); }
  75% { transform: translate(66px, -27px); } 87% { transform: translate(-28px, -63px); } 100% { transform: translate(0, 0); }
}
@keyframes flicker { 0%, 100% { opacity: .55; } 23% { opacity: .5; } 41% { opacity: .62; } 58% { opacity: .52; } 77% { opacity: .6; } }
/* dust sits on the paper, beneath the type and the print */
.motes { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

/* ---------- Intro layers ---------- */
.veil { position: fixed; inset: 0; z-index: 9; background: #000; display: none; }
.intro .veil { display: block; }
/* pre-roll while the film loads: the projector lamp warms up where the beam will begin */
.veil::after {
  content: ""; position: absolute; left: 50%; top: 0; width: min(92vw, 900px); height: 78vh;
  transform: translateX(-50%); opacity: 0;
  background:
    radial-gradient(ellipse 9% 7% at 50% 0%, rgba(245, 243, 239, .34), rgba(245, 243, 239, 0) 100%),
    radial-gradient(ellipse 34% 62% at 50% 0%, rgba(245, 243, 239, .075), rgba(245, 243, 239, 0) 100%);
  animation: lampOn 1.4s .2s cubic-bezier(.3, .6, .3, 1) forwards, lampFlick 1.9s 1.6s ease-in-out infinite;
}
@keyframes lampOn { to { opacity: 1; } }
@keyframes lampFlick { 0%, 100% { opacity: 1; } 37% { opacity: .9; } 52% { opacity: .97; } 71% { opacity: .88; } }
.intro .rv { opacity: 0; }
.fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 10; display: block; touch-action: none; }
.skip {
  position: fixed; z-index: 11; display: none;
  right: max(14px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
  background: none; border: 0; cursor: pointer;
  padding: 12px 6px;
  font-family: var(--sans); font-weight: 500; font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
  color: rgba(245, 243, 239, .72);
}
.skip:hover, .skip:focus-visible { color: #F5F3EF; outline: none; text-decoration: underline; text-underline-offset: 5px; }
.intro .skip { display: block; }
.fallback.played .card { animation: cardIn 1.1s cubic-bezier(.2, .7, .2, 1) both; }
.back {
  position: fixed; z-index: 4; display: none;
  top: max(2px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left));
  padding: 8px 10px;
  font-family: var(--sans); font-weight: 500; font-size: 11px; letter-spacing: .24em; text-transform: uppercase;
  color: var(--ink-3); text-decoration: none;
}
.back:hover { color: var(--ink); }
.back:focus-visible { color: var(--ink); outline: 1px solid var(--ink); outline-offset: 2px; }
html.from-designs:not(.intro) .back { display: block; }

@media (prefers-reduced-motion: reduce) {
  .grain { animation: none; }
}
</style>
</head>

<script>
/* =====================================================================
   CONFIG — every word on the card lives here.
   ===================================================================== */
window.CONFIG = {
  eyebrow: 'Save the Date',
  partner1: 'Amy',
  partner2: 'Bobby',
  coupleLong: 'Amy & Bobby',
  fullNames: 'Amy & Bobby',
  weekday: 'Sunday · 4:00 PM',
  dateParts: ['03', '07', '2027'],           // shown as 03 · 07 · 2027 (stacked on phones)
  dateLong: 'March 7, 2027',                  // screen readers; the weekday line follows it
  weddingDay: [2027, 3, 7],                 // y, m, d (local) for the countdown
  venue: 'The House on the River',
  region: 'Fort Lauderdale · Florida',
  note: 'Formal invitation to follow',
  photo: 'assets/amy-bobby-bw.jpg',
  event: {
    uid: '20270307-amy-bobby@save-the-date',
    start: '20270307T210000Z',   // 4:00 PM EST
    end: '20270308T040000Z',     // 11:00 PM EST
    summary: 'Amy & Bobby — Wedding',
    location: 'The House on the River, Fort Lauderdale, Florida',
    description: 'Save the date. Formal invitation to follow.',
    filename: 'amy-bobby-save-the-date.ics'
  }
};

(function () {

    uniform sampler2D tTarget;
    ${GLSL_SNOISE_GRAD}
    void main(){
      vec2 uv = gl_FragCoord.xy / resolution.xy;
      vec4 P = texture2D(texturePosition, uv);
      vec4 V = texture2D(textureVelocity, uv);
      if (uTime < P.w) { gl_FragColor = V; return; }
      vec4 T = texture2D(tTarget, uv);
      float isG = T.w, r = V.w;
      vec3 p = P.xyz * uPS + uO, v = V.xyz;
      vec3 c = curlNoise(p * 0.0021 + vec3(0., 0., uTime * 0.11));
      float smoke = mix(uSmokeE, uSmokeG, isG);
      /* 1. one ribbon of silver along the beam, gently braided by the curl field (bounded, never a hook) */
      vec3 cn = c * uNoise; cn *= min(1., uSpeed * .5 / (length(cn) + 1e-3));
      vec3 desired = vec3(uAxis * uSpeed * (0.6 + 0.8 * r), 0.) + cn;
      v = mix(v, desired, (1. - exp(-uDt * 1.9)) * uStream);
      /* cone confinement: whatever drifts out of the light is drawn back into it */
      vec2 rel = p.xy - uSrc; float al = dot(rel, uAxis);

      float vo = max(dot(v.xy, pd), 0.);
      v.xy -= pd * (ex * 8. + vo * min(ex / 30., 1.) * 4.) * uDt * uStream;

      vec3 toT = T.xyz - p;

      vec3 sv = c * 70. + vec3(0., 34. + 30. * r, 120. + 110. * r);

      vec2 d = p.xy - uPtr.xy; float rr = length(d);
      float f = uPtrAmt * exp(-rr * rr / (uPtrR * uPtrR));

  const posShader = /* glsl */`
    uniform float uTime, uDt, uPS;

  const velVar = gpu.addVariable('textureVelocity', velShader, vel0);

  gpu.setVariableDependencies(posVar, [posVar, velVar]);

  const SPEED = H * 0.36;
  Object.assign(vu, {
    uTime: { value: 0 }, uDt: { value: 1 / 60 }, uK: { value: 0 }, uC: { value: 0 }, uLock: { value: 0 },
    uStream: { value: 1 }, uNoise: { value: 0.35 * SPEED }, uSmokeE: { value: 0 }, uSmokeG: { value: 0 },
    uAxis: { value: axis.clone() }, uSrc: { value: new THREE.Vector2(...src) }, uBeamTan: { value: beamTan }, uSpeed: { value: SPEED },
    uPS: { value: PS }, uO: { value: O },
    uPtr: { value: new THREE.Vector3(1e5, 1e5, 0) }, uPtrR: { value: W < 700 ? 54 : 72 }, uPtrAmt: { value: 0 },

  });
  Object.assign(pu, { uTime: { value: 0 }, uDt: { value: 1 / 60 }, uPS: { value: PS } });
  const err = gpu.init();
  if (err) throw new Error(err);

  function simStep(s, dt) {
    const att = smooth(TL.attract[0], TL.attract[1], s);
    vu.uTime.value = pu.uTime.value = s;
    vu.uDt.value = pu.uDt.value = dt;
    vu.uStream.value = 1 - att;

  /* ------------------------------------------------------------------
     Particle render (silver, per-particle depth of field, lit only inside the beam)
     ------------------------------------------------------------------ */
  const density = nG / Math.max(1, glyph.areaCss);              // glyph particles per CSS px²
  const base = THREE.MathUtils.clamp(Math.sqrt(0.95 / (density * 0.3 * 0.7)), 1.05, 2.6);
  const alphaG = Math.min(1, 0.95 / (density * 0.3 * base * base));

  const refs = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) { refs[i * 2] = ((i % SX) + .5) / SX; refs[i * 2 + 1] = (Math.floor(i / SX) + .5) / SY; }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  pGeo.setAttribute('ref', new THREE.BufferAttribute(refs, 2));
  const pMat = new THREE.ShaderMaterial({
    uniforms: {
      tPos: { value: null }, tTarget: { value: tTarget },
      uTime: { value: 0 }, uDpr: { value: dpr }, uD: { value: D }, uBase: { value: base },
      uAlphaG: { value: alphaG }, uAlphaE: { value: 0.42 }, uAp: { value: 0.03 },
      uSweepX: { value: -1e5 }, uSweepW: { value: L.fontSize * 0.55 }, uSweepAmt: { value: 0 },
      uFadeG: { value: 1 }, uFadeE: { value: 1 }, uFormed: { value: 0 }, uBoost: { value: 1 },
      uPS: { value: PS }, uO: { value: O },
      uSrc: { value: new THREE.Vector2(...src) }, uAxis: { value: axis.clone() }, uTan: { value: beamTan }, uBeamI: { value: 0 }
    },
    vertexShader: /* glsl */`
      uniform sampler2D tPos, tTarget;
      uniform float uTime, uDpr, uD, uBase, uAlphaG, uAlphaE, uAp, uSweepX, uSweepW, uSweepAmt, uFadeG, uFadeE, uFormed, uBoost, uPS, uTan, uBeamI;

        gl_Position = projectionMatrix * mv;

        float size = (b + coc) * persp;
        gl_PointSize = max(size * uDpr, 1.);

        float spark = mix(.62 + .38 * sin(uTime * (2.2 + 3. * seed) + seed * 40.), 1., uFormed * isG);
        float sw = uSweepAmt * exp(-pow((wp.x - uSweepX) / uSweepW, 2.)) * isG;

        vec2 rel = wp.xy - uSrc; float al = dot(rel, uAxis);
        float pe = abs(rel.x * uAxis.y - rel.y * uAxis.x);
        float hw = max(al, 0.) * uTan + 10.;
        float inB = smoothstep(hw * 1.1, hw * .55, pe) * smoothstep(-30., 50., al);

    fragmentShader: /* glsl */`

  const points = new THREE.Points(pGeo, pMat); points.frustumCulled = false;
  const pScene = new THREE.Scene(); pScene.add(points);

  /* silver print of the exact glyph outlines: once the numerals lock it fills the stipple and keeps
     Bodoni's hairlines continuous at phone sizes */
  const gTex = new THREE.CanvasTexture(glyph.canvas);
  gTex.colorSpace = THREE.NoColorSpace; gTex.generateMipmaps = true;
  gTex.minFilter = THREE.LinearMipmapLinearFilter; gTex.magFilter = THREE.LinearFilter;
  const gW = glyph.cw / glyph.S, gH = glyph.ch / glyph.S;
  const gC = toWorld(L.date.left - glyph.pad + gW / 2, L.date.top - glyph.pad + gH / 2);
  const gMat = new THREE.ShaderMaterial({
    uniforms: { tG: { value: gTex }, uA: { value: 0 }, uSweepX: { value: -1e5 }, uSweepW: { value: L.fontSize * 0.55 }, uSweepAmt: { value: 0 } },
    vertexShader: /* glsl */`
      varying vec2 vUv; varying float vX;

  /* ------------------------------------------------------------------
     Beam + dust motes (half resolution — they are soft by nature)
     ------------------------------------------------------------------ */
  const bgScene = new THREE.Scene();
  const beamMat = new THREE.ShaderMaterial({
    uniforms: { uRes: { value: new THREE.Vector2(W, H) }, uSrc: { value: new THREE.Vector2(...src) }, uAxis: { value: axis.clone() },

    vertexShader: QUAD_VERT,
    fragmentShader: /* glsl */`

  for (let i = 0; i < MN; i++) {
    const z = mix(-D * 0.45, D * 0.3, Math.pow(rnd(), 1.4));
    const sc = (D - z) / D;
    mPos[i * 3] = (rnd() - .5) * W * sc * 1.1; mPos[i * 3 + 1] = (rnd() - .5) * H * sc * 1.1; mPos[i * 3 + 2] = z; mSeed[i] = rnd();

  const mGeo = new THREE.BufferGeometry();
  mGeo.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
  mGeo.setAttribute('seed', new THREE.BufferAttribute(mSeed, 1));
  const beamUniforms = () => ({ uSrc: { value: new THREE.Vector2(...src) }, uAxis: { value: axis.clone() }, uTan: { value: beamTan } });
  const moteMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uDpr: { value: dpr * Q.bg }, uD: { value: D }, uInt: { value: 0 }, ...beamUniforms() },
    vertexShader: /* glsl */`
      uniform float uTime, uDpr, uD, uTan, uInt; uniform vec2 uSrc, uAxis;

  const FGN = W < 700 ? 6 : 9;

  fGeo.setAttribute('seed', new THREE.BufferAttribute(fSeed, 1));
  const fgMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uDpr: { value: dpr * Q.bg }, uD: { value: D }, uEnv: { value: 0 }, uScale: { value: W < 700 ? 0.72 : 1 }, ...beamUniforms() },

        vec2 s = p.xy * persp;

        float hw = al * uTan + 10.;

    fragmentShader: /* glsl */`
      varying float vA;
      void main(){

        float disc = smoothstep(1., .86, r) * (.8 + .2 * smoothstep(.55, .95, r));   /* flat aperture disc, faint bright rim */

     Targets, bloom, final composite

  const rtOpts = { type: rtType, depthBuffer: false, stencilBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
  const rtBG = new THREE.WebGLRenderTarget(Math.max(2, Math.round(bufW * Q.bg)), Math.max(2, Math.round(bufH * Q.bg)), rtOpts);
  const rtP = new THREE.WebGLRenderTarget(bufW, bufH, rtOpts);
  let bloom = null;
  if (Q.bloom) {
    bloom = new UnrealBloomPass(new THREE.Vector2(Math.round(bufW * Q.bloomScale), Math.round(bufH * Q.bloomScale)), 0, 0.42, 0.82);
    bloom.bloomTintColors.forEach((c) => c.set(1, 1, 1));   /* strictly monochrome */
  }

  /* development reach, normalised to this viewport: the front always takes the whole TL.dev window to
     cover the frame (phone or desktop), so its speed reads the same everywhere */
  const devC = [(dc[0] + W / 2) / W, (dc[1] + H / 2) / H], asp = W / H;
  const maxD = Math.max(...[[0, 0], [1, 0], [0, 1], [1, 1]].map(([x, y]) => Math.hypot((x - devC[0]) * asp, y - devC[1])));
  const devK = maxD;                 /* reach of the farthest corner, in aspect units */
  const compMat = new THREE.ShaderMaterial({
    uniforms: {
      tBG: { value: rtBG.texture }, tP: { value: rtP.texture },
      uRes: { value: new THREE.Vector2(W, H) }, uTime: { value: 0 },
      uDev: { value: 0 }, uDevC: { value: new THREE.Vector2((dc[0] + W / 2) / W, (dc[1] + H / 2) / H) },
      uWeave: { value: 0 }, uFlicker: { value: 0 }, uGrain: { value: 0 }, uVig: { value: 0 }, uLift: { value: 0 },
      uDevK: { value: devK },
      /* the date's box in uv (y up), padded: only the glyph particles turn to ink on the paper */
      uInkBox: { value: new THREE.Vector4(
        (L.date.left - L.fontSize * .25) / W, 1 - (L.date.top + L.date.height + L.fontSize * .2) / H,
        (L.date.left + L.date.width + L.fontSize * .25) / W, 1 - (L.date.top - L.fontSize * .2) / H) },
      uInkF: { value: L.fontSize * .3 / W }
    },
    vertexShader: QUAD_VERT,
    fragmentShader: /* glsl */`
      uniform sampler2D tBG, tP; uniform vec2 uRes, uDevC;

      uniform vec4 uInkBox;
      varying vec2 vUv;
      ${GLSL_VNOISE}
      void main(){
        float asp = uRes.x / uRes.y;

        float fl = 1. + uFlicker * (vnoise(vec2(uTime * 21., 3.7)) - .5) + uFlicker * .5 * (vnoise(vec2(uTime * 5., 9.1)) - .5);
        vec3 scene = (bg + pc) * fl;

        scene += uLift * (1. - scene);                           /* the house lights come up a touch before the print develops */
        /* darkroom development: paper spreading like ink in water from the date (domain-warped fbm, fine tendrils) */
        float m = 0.;
        if (uDev > 0.) {
          vec2 sp = uv * vec2(asp, 1.) * 2.2;
          vec2 warp = vec2(fbm2l(sp * 1.3 + vec2(uTime * .09, 0.)), fbm2l(sp * 1.3 + vec2(5.2, -uTime * .08)));
          float n = fbm2(sp + warp * 1.7);
          float n2 = fbm2l(uv * vec2(asp, 1.) * 9.0 + warp * 2.);
          float n3 = fbm2l(sp * 5.0 + warp * 3.4);
          float rid = 1. - abs(2. * n3 - 1.);                     /* ridged octave: filaments, not puffs */
          vec2 dq = (uv - uDevC) * vec2(asp, 1.);
          /* zero-mean noise so the front's reach maps linearly onto uDev; kept gentle so the print develops
             as one organic bloom rather than detached ink islands */
          float nz = (n * .9 + n2 * .1 + rid * .26 - .78) * .42;
          /* distance normalised to the farthest corner: the bloom starts at the date on any frame shape */
          float thr = mix(.02, .78, uDev) - length(dq) / uDevK * .75 - nz + smoothstep(.9, 1., uDev) * .4;
          /* feathered, grain-dithered edge: silver halide resolving, not a cut-out */
          float hal = hash12(uv * uRes + floor(uTime * 24.) * 17.3) - .5;
          m = smoothstep(-.012, .045, thr + hal * .03);
          /* a soft grey halo where the developer front meets the dark */
          float band = smoothstep(-.09, .0, thr) * (1. - m);
          scene = mix(scene, vec3(.14 + .05 * n2), band * .55);
        }
        float aS = 1. - m;
        /* silver becomes ink: particle light turns into pigment on the paper */
        float lum = dot(pc, vec3(1. / 3.));
        /* stray smoke outside the date simply dissolves into the light instead of staining the paper */
        vec2 ib = smoothstep(uInkBox.xy - vec2(uInkF, uInkF * asp), uInkBox.xy, uv) * (1. - smoothstep(uInkBox.zw, uInkBox.zw + vec2(uInkF, uInkF * asp), uv));
        float cov = (1. - exp(-lum * 2.8)) * m * ib.x * ib.y;
        vec3 rgb = vec3(.0549) * cov + scene * aS * (1. - cov);
        float a = cov + aS * (1. - cov);
        gl_FragColor = vec4(rgb, a);
      }`,
    depthTest: false, depthWrite: false
  });
  const comp = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compMat); comp.frustumCulled = false;
  const compScene = new THREE.Scene(); compScene.add(comp);

  /* adaptive quality: if the device cannot hold ~50 fps, drop bloom and render at 1.5x */
  function degrade() {
    if (bloom) { bloom.dispose(); bloom = null; }
    const nd = Math.min(dpr, 1.5);
    if (nd < dpr) {
      dpr = nd; renderer.setPixelRatio(nd); renderer.setSize(W, H, false);
      bufW = Math.round(W * dpr); bufH = Math.round(H * dpr);
      rtP.setSize(bufW, bufH); rtBG.setSize(Math.max(2, Math.round(bufW * Q.bg)), Math.max(2, Math.round(bufH * Q.bg)));
      pMat.uniforms.uDpr.value = dpr; moteMat.uniforms.uDpr.value = fgMat.uniforms.uDpr.value = dpr * Q.bg;
    }
    if (window.__noirInfo) window.__noirInfo.degraded = true;
  }

  /* ------------------------------------------------------------------
     Pointer, skip, resize
     ------------------------------------------------------------------ */
  const ptr = { x: 1e5, y: 1e5, amt: 0, target: 0, last: 0 };
  const onMove = (e) => {
    const [x, y] = toWorld(e.clientX, e.clientY);
    ptr.x = x; ptr.y = y; ptr.target = 1; ptr.last = performance.now();
  };
  let skipping = false, done = false, raf = 0, onVis = null;
  const skip = () => {
    if (done || skipping) return;
    skipping = true;
    applyHTML(TL.end);
    $('.veil').style.display = 'none';   /* the card is what the canvas fades to */
    canvas.style.transition = 'opacity .65s cubic-bezier(.4,0,.2,1)';
    canvas.style.opacity = '0';
    setTimeout(finish, 680);
  };
  const onKey = (e) => { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); skip(); } };
  const onResize = () => { if (Math.abs(innerWidth - W) > 2 || Math.abs(innerHeight - H) > 90) skip(); };
  const skipBtn = $('#skip');
  addEventListener('pointermove', onMove, { passive: true });
  addEventListener('keydown', onKey);
  addEventListener('resize', onResize);
  canvas.addEventListener('click', skip);
  skipBtn.addEventListener('click', (e) => { e.stopPropagation(); skip(); });

  /* ------------------------------------------------------------------
     HTML choreography (driven by the same clock)
     ------------------------------------------------------------------ */
  const allRv = [...document.querySelectorAll('.rv')];
  const rvEls = allRv.filter((el) => el.getClientRects().length > 0);
  const veil = $('.veil');
  let themeSet = false;
  function applyHTML(t) {
    root.style.setProperty('--date-o', smooth(TL.handoff[0], TL.handoff[1], t).toFixed(4));
    rvEls.forEach((el, i) => {
      const k = smooth(TL.text[0] + i * 0.07, TL.text[1] + i * 0.07, t);
      el.style.opacity = k.toFixed(4);
      el.style.transform = k < 1 ? `translateY(${((1 - k) * 5).toFixed(2)}px)` : '';
    });
    const f = smooth(TL.photo[0], TL.photo[1], t);
    const fe = 1 - Math.pow(1 - f, 2.2);
    /* fog grey -> rising contrast -> full blacks (a print in the developer tray) */
    root.style.setProperty('--fog', `brightness(${mix(1.62, 1, fe).toFixed(3)}) contrast(${mix(0.22, 1, Math.pow(f, 1.25)).toFixed(3)}) blur(${((1 - fe) * 1.1).toFixed(2)}px)`);
    skipBtn.style.opacity = (1 - smooth(3.8, 4.2, t)).toFixed(3);
    skipBtn.style.visibility = t > 4.2 ? 'hidden' : '';
    if (!themeSet && t > TL.dev[0] + 0.8) { themeSet = true; metaTheme && metaTheme.setAttribute('content', '#F5F3EF'); }
  }

  /* ------------------------------------------------------------------
     Render one frame at timeline time t
     ------------------------------------------------------------------ */
  function render(t) {
    const beamI = smooth(TL.beamIn[0], TL.beamIn[1], t) * (1 - smooth(TL.beamOut[0], TL.beamOut[1], t));
    beamMat.uniforms.uTime.value = t; beamMat.uniforms.uInt.value = beamI;
    moteMat.uniforms.uTime.value = t; moteMat.uniforms.uInt.value = beamI;
    fgMat.uniforms.uTime.value = t;
    fgMat.uniforms.uEnv.value = smooth(TL.fg[0], TL.fg[0] + 0.7, t) * (1 - smooth(TL.fg[1] - 0.5, TL.fg[1], t));

    const sweepP = clamp01((t - TL.sweep[0]) / (TL.sweep[1] - TL.sweep[0]));
    const sweepE = easeInOutCubic(sweepP);
    const sweepBump = Math.sin(Math.PI * sweepP);
    const sweepX = mix(L.date.left - W / 2 - L.fontSize * 1.2, L.date.right - W / 2 + L.fontSize * 1.2, sweepE);
    const formed = smooth(TL.lock[0], TL.lock[1], t);
    const fadeG = 1 - smooth(TL.handoff[0], TL.handoff[1], t);
    const pu2 = pMat.uniforms;
    pu2.tPos.value = gpu.getCurrentRenderTarget(posVar).texture;
    pu2.uTime.value = t;
    pu2.uSweepX.value = sweepX; pu2.uSweepAmt.value = sweepBump;
    pu2.uFormed.value = formed;
    pu2.uBoost.value = mix(3.2, 1, smooth(TL.attract[0] + 0.3, TL.lock[1], t));
    pu2.uFadeG.value = fadeG;
    pu2.uFadeE.value = (1 - smooth(TL.fadeE[0], TL.fadeE[1], t)) * mix(1, .55, smooth(TL.dev[0], TL.dev[1], t));
    pu2.uBeamI.value = beamI;
    gMat.uniforms.uA.value = formed * mix(0.35, 0.5, 1 - fadeG) * fadeG;
    gMat.uniforms.uSweepX.value = sweepX; gMat.uniforms.uSweepAmt.value = sweepBump;

    /* most of the frame lies at 30-90 % of the farthest reach, so the ramp is flattened through its
       middle: the paper's luminance rises steadily over the whole window instead of flashing */
    const devP = clamp01((t - TL.dev[0]) / (TL.dev[1] - TL.dev[0]));
    const dev = clamp01(devP + 0.3 * (devP - easeInOutSine(devP)));   /* slightly slower through the middle, where most of the frame turns */
    const cu = compMat.uniforms;
    cu.uTime.value = t; cu.uDev.value = dev;
    cu.uWeave.value = 1.4 * (1 - smooth(2.4, 3.1, t));
    cu.uFlicker.value = 0.13 * (1 - smooth(3.4, 4.3, t)) * smooth(0.0, 0.5, t);
    cu.uGrain.value = 0.055 * (1 - dev);
    cu.uVig.value = 0.9 * (1 - dev);
    cu.uLift.value = 0.106 * smooth(TL.lift[0], TL.lift[1], t);

    renderer.setClearColor(0x000000, 1);
    renderer.setRenderTarget(rtBG); renderer.clear();
    if (beamI > 0.001 || fgMat.uniforms.uEnv.value > 0.001) renderer.render(bgScene, cam);
    renderer.setRenderTarget(rtP); renderer.clear();
    renderer.render(pScene, cam);
    if (bloom) {
      const bs = 0.32 * smooth(TL.bloomUp[0], TL.bloomUp[1], t) * (1 - smooth(TL.bloomDown[0], TL.bloomDown[1], t)) + 0.22 * sweepBump;
      bloom.strength = bs;
      if (bs > 0.004) bloom.render(renderer, null, rtP, 0, false);
    }
    renderer.setRenderTarget(null);
    renderer.setClearColor(0x000000, 0); renderer.clear();
    renderer.render(compScene, cam);
  }

  function finish() {
    if (done) return;
    done = true;
    cancelAnimationFrame(raf);
    removeEventListener('pointermove', onMove);
    removeEventListener('keydown', onKey);
    removeEventListener('resize', onResize);
    if (onVis) document.removeEventListener('visibilitychange', onVis);
    applyHTML(TL.end + 1);
    root.classList.add('played');
    root.classList.remove('intro');
    root.style.removeProperty('--date-o'); root.style.removeProperty('--fog');
    allRv.forEach((el) => { el.style.opacity = ''; el.style.transform = ''; });
    skipBtn.style.cssText = '';
    if (metaTheme) metaTheme.setAttribute('content', '#F5F3EF');
    /* dispose every heavy intro resource */
    try {
      gpu.dispose && gpu.dispose();
      tTarget.dispose(); gTex.dispose(); rtBG.dispose(); rtP.dispose(); bloom && bloom.dispose();
      [pGeo, mGeo, fGeo, gQuad.geometry, beam.geometry, comp.geometry].forEach((g) => g.dispose());
      [pMat, gMat, moteMat, fgMat, beamMat, compMat].forEach((m) => m.dispose());
      renderer.dispose(); renderer.forceContextLoss();
    } catch (e) {}
    canvas.remove();
    startAmbient();
    window.__noirShot = true;
  }

  /* ------------------------------------------------------------------
     Clock: fixed-step simulation, deterministic ?t= freeze
     ------------------------------------------------------------------ */
  const FIX = 1 / 60;
  let simT = 0;
  if (frozen !== null && frozen !== undefined) {
    if (frozen >= TL.end) { finish(); return; }
    const dt = 1 / 30;
    while (simT + dt <= frozen) { simStep(simT, dt); simT += dt; }
  }
  /* the lamp glow stays beneath the canvas while it fades in (driven by the same clock in frame),
     so the beam grows out of it and the veil can never drop before the canvas is opaque */
  if (frozen != null) veil.style.display = 'none';

  let t0 = 0, paused = false, pauseAt = 0;
  onVis = () => {
    if (document.hidden) { paused = true; pauseAt = performance.now(); cancelAnimationFrame(raf); }
    else if (paused) { paused = false; t0 += performance.now() - pauseAt; lastNow = 0; raf = requestAnimationFrame(frame); }
  };
  document.addEventListener('visibilitychange', onVis);

  const ft = []; let lastNow = 0, adapted = frozen != null;
  function frame(now) {
    if (done) return;
    if (!t0) t0 = now;
    if (!adapted) {
      if (lastNow) ft.push(now - lastNow);
      lastNow = now;
      if (ft.length >= 30) { adapted = true; ft.sort((a, b) => a - b); if (ft[15] > 20) degrade(); }
    }
    const t = frozen ?? (now - t0) / 1000;
    if (frozen == null) {
      /* pointer influence eases in/out */
      if (now - ptr.last > 140) ptr.target = 0;
      ptr.amt += (ptr.target * 430 - ptr.amt) * 0.12;
      vu.uPtr.value.set(ptr.x, ptr.y, 0);
      let steps = 0;
      while (simT + FIX <= t && steps < 5) { simStep(simT, FIX); simT += FIX; steps++; }
      if (steps === 5 && simT + FIX <= t) simT = t;   /* never spiral on slow frames */
    }
    if (!skipping) {
      applyHTML(t);
      if (frozen == null && veil.style.display !== 'none') {
        const k = Math.min(1, t / 0.85);
        canvas.style.opacity = (k * k * (3 - 2 * k)).toFixed(3);
        if (k >= 1) veil.style.display = 'none';
      }
    }
    render(t);
    if (t >= TL.end) { finish(); return; }
    raf = requestAnimationFrame(frame);
  }
  render(frozen ?? 0);
  applyHTML(frozen ?? 0);
  window.__noirInfo = { tier: TIER, N, nG, base: +base.toFixed(2), alphaG: +alphaG.toFixed(2), area: Math.round(glyph.areaCss), float: hasFloatRT, dpr, startedAt: Math.round(performance.now()) };
  if (frozen != null) requestAnimationFrame(() => requestAnimationFrame(() => { window.__noirShot = true; }));
  raf = requestAnimationFrame(frame);
}

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* =====================================================================
   Ambient (cheap): CSS grain + flicker, a few bokeh motes,
   and a liquid ripple on the print under pointer / touch.
   ===================================================================== */
let ambientStarted = false;
function startAmbient() {
  if (ambientStarted || STD.reduce) return;
  ambientStarted = true;
  startMotes();
  startRipple();
}

function startMotes() {
  const cv = document.createElement('canvas');
  cv.className = 'motes'; cv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  /* retina-sharp: backing store at device density (capped at 2), drawn in CSS pixels */
  const resize = () => {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize(); addEventListener('resize', resize);
  /* pre-rendered sprites: crisp speck and soft bokeh disc */
  const sprite = (soft) => {
    const s = 64, c = document.createElement('canvas'); c.width = c.height = s; const x = c.getContext('2d');
    const g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    if (soft) { g.addColorStop(0, 'rgba(14,14,14,.55)'); g.addColorStop(.72, 'rgba(14,14,14,.62)'); g.addColorStop(.86, 'rgba(14,14,14,.4)'); g.addColorStop(1, 'rgba(14,14,14,0)'); }
    else { g.addColorStop(0, 'rgba(14,14,14,1)'); g.addColorStop(.4, 'rgba(14,14,14,.6)'); g.addColorStop(1, 'rgba(14,14,14,0)'); }
    x.fillStyle = g; x.fillRect(0, 0, s, s); return c;
  };
  const sharp = sprite(false), soft = sprite(true);
  const n = innerWidth < 700 ? 14 : 24;
  const M = Array.from({ length: n }, () => {
    const z = Math.random();
    return { x: Math.random(), y: Math.random(), z, s: Math.random() * 1000,
      r: z < .55 ? .8 + z * 1.6 : 4 + (z - .55) * 22, a: z < .55 ? .10 : .022 + (1 - z) * .03 };
  });
  let raf = 0, last = 0;
  const tick = (now) => {
    raf = requestAnimationFrame(tick);
    if (now - last < 32) return;           /* ~30 fps is plenty for slow dust */
    last = now;
    const t = now / 1000;
    ctx.clearRect(0, 0, W, H);
    for (const m of M) {
      const x = ((m.x * W + t * (4 + m.z * 9) + Math.sin(t * .23 + m.s) * 26) % (W + 60) + W + 60) % (W + 60) - 30;
      const y = ((m.y * H - t * (3 + m.z * 6) + Math.cos(t * .19 + m.s) * 20) % (H + 60) + H + 60) % (H + 60) - 30;
      ctx.globalAlpha = m.a * (.75 + .25 * Math.sin(t * .7 + m.s));
      const r = m.r;
      ctx.drawImage(m.z < .55 ? sharp : soft, x - r, y - r, r * 2, r * 2);
    }
  };
  const vis = () => { cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(tick); };
  document.addEventListener('visibilitychange', vis);
  raf = requestAnimationFrame(tick);
}

function startRipple() {
  const box = $('#photo'), img = $('#photoImg');
  if (!box || !img) return;
  const cv = document.createElement('canvas'); cv.setAttribute('aria-hidden', 'true');
  box.appendChild(cv);
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: cv, alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false });
  } catch (e) { cv.remove(); return; }
  /* a detached Image: its width/height are the natural pixel size (the DOM <img> reports its CSS box) */
  const src = new Image();
  const tex = new THREE.Texture(src);
  tex.colorSpace = THREE.NoColorSpace;
  tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  let texReady = false;
  src.onload = () => { tex.needsUpdate = true; texReady = true; };
  src.src = img.currentSrc || img.src;
  const NR = 10;
  const ripples = Array.from({ length: NR }, () => new THREE.Vector4(-1e4, -1e4, -100, 0));
  const mat = new THREE.ShaderMaterial({
    uniforms: { tImg: { value: tex }, uBox: { value: new THREE.Vector2(1, 1) }, uImg: { value: new THREE.Vector2(img.naturalWidth || 1356, img.naturalHeight || 1808) },
      uPos: { value: new THREE.Vector2(.5, .16) }, uR: { value: ripples }, uTime: { value: 0 }, uPtr: { value: new THREE.Vector2(-1e4, -1e4) }, uHover: { value: 0 } },
    vertexShader: QUAD_VERT,
    fragmentShader: /* glsl */`
      uniform sampler2D tImg; uniform vec2 uBox, uImg, uPos, uPtr; uniform vec4 uR[${NR}]; uniform float uTime, uHover;
      varying vec2 vUv;
      void main(){
        vec2 px = vec2(vUv.x, 1. - vUv.y) * uBox;
        vec2 disp = vec2(0.); float crest = 0.;
        for (int i = 0; i < ${NR}; i++) {
          vec4 R = uR[i]; float age = uTime - R.z;
          if (age < 0. || age > 3.2) continue;
          vec2 d = px - R.xy; float r = length(d);
          float front = age * 190.;
          float env = exp(-pow((r - front) / 46., 2.)) * exp(-age * 1.35) * R.w;
          float k = sin((r - front) * .085) * env;
          disp += (d / (r + 1.)) * k * 10.; crest += k;
        }
        vec2 dh = px - uPtr; float rh2 = dot(dh, dh);
        disp -= dh * exp(-rh2 / (95. * 95.)) * .075 * uHover;   /* soft liquid lens under the finger */
        vec2 p = px + disp;
        float s = max(uBox.x / uImg.x, uBox.y / uImg.y); vec2 sz = uImg * s; vec2 off = (uBox - sz) * uPos;
        vec2 t = (p - off) / sz; t.y = 1. - t.y;
        vec3 c = texture2D(tImg, clamp(t, vec2(.001), vec2(.999)), -0.8).rgb;   /* negative LOD bias: as crisp as the HTML print */
        c += crest * .035;
        gl_FragColor = vec4(c, 1.);
      }`,
    depthTest: false, depthWrite: false
  });
  const scene = new THREE.Scene(); const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat); quad.frustumCulled = false; scene.add(quad);
  const cam = new THREE.Camera();
  let bw = 0, bh = 0;
  const size = () => {
    const r = box.getBoundingClientRect(); bw = r.width; bh = r.height;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(bw, bh, false);
    mat.uniforms.uBox.value.set(bw, bh);
  };
  size(); addEventListener('resize', () => { size(); kick(); });
  const t0 = performance.now();
  let ri = 0, lastDrop = 0, hover = 0, hoverT = 0, raf = 0, running = false, lastMove = 0;
  const local = (e) => { const r = box.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top, r]; };
  const drop = (x, y, amp) => { const t = (performance.now() - t0) / 1000; ripples[ri].set(x, y, t, amp); ri = (ri + 1) % NR; lastDrop = performance.now(); kick(); };
  box.addEventListener('pointermove', (e) => {
    const [x, y] = local(e); mat.uniforms.uPtr.value.set(x, y); hoverT = 1; lastMove = performance.now();
    if (performance.now() - lastDrop > 140) drop(x, y, .35);
    kick();
  }, { passive: true });
  box.addEventListener('pointerdown', (e) => { const [x, y] = local(e); mat.uniforms.uPtr.value.set(x, y); drop(x, y, 1); }, { passive: true });
  box.addEventListener('pointerleave', () => { hoverT = 0; kick(); });
  function alive(t) { return texReady && (hover > .003 || ripples.some((r) => t - r.z < 3.2)); }
  function frame() {
    const t = (performance.now() - t0) / 1000;
    if (performance.now() - lastMove > 900) hoverT = 0;
    hover += (hoverT - hover) * .08;
    mat.uniforms.uTime.value = t; mat.uniforms.uHover.value = hover;
    if (!alive(t)) { renderer.setClearColor(0, 0); renderer.clear(); running = false; return; }   /* idle: HTML print shows, zero cost */
    renderer.render(scene, cam);
    raf = requestAnimationFrame(frame);
  }
  function kick() { if (!running && !document.hidden) { running = true; raf = requestAnimationFrame(frame); } }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); running = false; } });
}
</script>
</body>
</html>
