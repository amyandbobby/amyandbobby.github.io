<style>
:root{
  --paper:#F4ECE1;          /* linen */
  --sand:#D9C4A9;
  --rose:#C8697F;           /* dusty rose (decor) */
  --rose-ink:#94455A;       /* rose for text: 5.5:1 on paper */
  --terra:#DE7849;
  --sage:#748A4E;
  --olive:#2C3524;          /* ink: 10.9:1 on paper */
  --olive-2:#3E4733;        /* secondary ink: 8.3:1 */
  --rule:rgba(44,53,36,.34);

  --pad-t:max(16px, env(safe-area-inset-top));
  --pad-b:max(14px, env(safe-area-inset-bottom));
  --pad-x:max(20px, env(safe-area-inset-left), env(safe-area-inset-right));

  /* portrait (phone) scale */
  --g:clamp(6px, 1.25svh, 14px);
  --fs-script:clamp(28px, 4.3svh, 40px);
  --fs-name:clamp(24px, min(11.4vw, 5svh), 46px);
  --fs-date:min(14.6vw, 8svh, 76px);
  --fs-place:clamp(18px, 2.55svh, 24px);
  --fs-label:12px;
  --fs-note:clamp(16px, 2.05svh, 18px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--olive)}
body{
  font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;transition:opacity .7s ease}
#gl.on{opacity:1}

/* ───────────── the card ───────────── */
.card{
  position:relative;z-index:1;width:100%;height:100vh;height:100svh;
  display:grid;justify-items:center;align-content:stretch;text-align:center;
  padding:var(--pad-t) var(--pad-x) var(--pad-b);
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto auto auto auto auto;
  grid-template-areas:"eyebrow" "names" "photo" "date" "rule" "when" "place" "foot";
}
.eyebrow{grid-area:eyebrow;font:400 var(--fs-script)/1.12 "Pinyon Script",cursive;color:var(--rose-ink);margin-bottom:calc(var(--g)*.15);letter-spacing:.01em}

.photo{grid-area:photo;width:100%;height:100%;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.frame{position:relative;width:min(calc(100cqw - 18px), calc((100cqh - 9px) * .75));aspect-ratio:3/4}
.arch{position:absolute;inset:0;border-radius:9999px 9999px 0 0;overflow:hidden;background:transparent}
.arch img{width:100%;height:100%;object-fit:cover;object-position:49% 38%;transform:scale(var(--zoom,1.12));transform-origin:49% 38%;display:block;transition:opacity .5s}
.frame-line{position:absolute;inset:-8px -8px 0;border:1px solid var(--rule);border-radius:9999px 9999px 0 0;pointer-events:none}
.arch,.frame-line{-webkit-mask-image:linear-gradient(#000 64%, transparent 100%);mask-image:linear-gradient(#000 64%, transparent 100%)}

.names{grid-area:names;display:flex;align-items:baseline;justify-content:center;gap:.3em;margin:0 0 calc(var(--g)*1.3);font-weight:500}
.n1,.n2{font:500 var(--fs-name)/1 "Bodoni Moda",Didot,"Bodoni 72",serif;font-variation-settings:"opsz" var(--opsz-name,28);text-transform:uppercase;letter-spacing:.11em;margin-right:-.11em;color:var(--olive)}
.amp{display:inline;font:400 calc(var(--fs-name)*1.12)/.8 "Pinyon Script",cursive;color:var(--rose-ink);letter-spacing:0;transform:translateY(.02em)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.date{
  grid-area:date;font:400 var(--fs-date)/.86 "Bodoni Moda",Didot,"Bodoni 72",serif;color:var(--olive);
  font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;
  display:flex;align-items:center;justify-content:center;gap:.24em;line-height:1;
  margin:calc(var(--fs-date) * -.5) 0 calc(var(--g)*.6);position:relative;z-index:2;
  letter-spacing:.01em;font-variation-settings:"opsz" 96;
}
.date .sep{font-size:.7em;color:var(--rose-ink);line-height:1;transform:translateY(-.05em)}

.rule{grid-area:rule;display:flex;align-items:center;gap:12px;width:min(78%, 300px);margin:calc(var(--g)*1.4) 0 calc(var(--g)*1.1)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--rule)}
.dots{display:flex;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}

.label{font:500 var(--fs-label)/1.35 "Jost",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.26em;margin-right:-.26em;color:var(--olive)}
.when{grid-area:when}
.place{grid-area:place;margin-top:calc(var(--g)*.9)}
.venue{display:block;font:600 var(--fs-place)/1.15 "Bodoni Moda",Didot,serif;font-variation-settings:"opsz" 28;text-transform:uppercase;letter-spacing:.14em;margin-right:-.14em}
.region{display:block;margin-top:5px}
.foot{grid-area:foot;margin-top:calc(var(--g)*1.25);display:flex;flex-direction:column;align-items:center;gap:calc(var(--g)*.35)}
.note{font:italic 500 var(--fs-note)/1.25 "Cormorant Garamond",Georgia,serif;color:var(--olive-2);letter-spacing:.01em}
.links{display:flex;align-items:center;gap:10px}
.links a{font:500 var(--fs-link,11.5px)/1 "Jost",system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--olive);text-decoration:none;
  padding:9px 2px;margin:-4px 0;background:linear-gradient(var(--rule),var(--rule)) 0 calc(100% - 6px)/100% 1px no-repeat;transition:background-size .3s}
.links a:hover{background-image:linear-gradient(var(--rose-ink),var(--rose-ink))}
.links a:focus-visible,.skip:focus-visible{outline:1px solid var(--rose-ink);outline-offset:3px}
.links .mid{width:3px;height:3px;border-radius:50%;background:var(--rose-ink);opacity:.8}

.skip{position:fixed;z-index:3;right:max(16px, env(safe-area-inset-right));bottom:max(14px, env(safe-area-inset-bottom));
  font:500 11.5px/1 "Jost",system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--olive-2);
  background:none;border:0;padding:10px 4px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s}
.skip.on{opacity:.82;pointer-events:auto}

/* ───────────── landscape: centred editorial (ref #1 desktop) ───────────── */
@media (orientation:landscape){
  :root{
    --g:clamp(6px, 1.45svh, 18px);
    --fs-script:clamp(26px, 4.6svh, 52px);
    --fs-name:clamp(30px, 7.4svh, 86px);
    --fs-date:clamp(54px, 12.6svh, 150px);
    --fs-place:clamp(17px, 2.6svh, 28px);
    --fs-label:clamp(12px, 1.4svh, 15px);
    --fs-note:clamp(16px, 2.05svh, 22px);
    --fs-link:clamp(11.5px, 1.3svh, 13px);
    --pad-t:max(clamp(24px, 4.4svh, 60px), env(safe-area-inset-top));
    --pad-b:max(clamp(20px, 3.8svh, 52px), env(safe-area-inset-bottom));
  }
  .card{grid-template-rows:auto auto minmax(0,1fr) auto auto auto auto auto;
    grid-template-areas:"eyebrow" "names" "photo" "date" "rule" "when" "place" "foot";}
  .eyebrow{margin-bottom:0}
  .names{grid-area:names;display:flex;align-items:baseline;justify-content:center;gap:.3em;margin:calc(var(--g)*.2) 0 calc(var(--g)*2.3)}
  .n1,.n2{margin:0 -.11em 0 0}
  .amp{display:inline;font:400 calc(var(--fs-name)*1.12)/.8 "Pinyon Script",cursive;color:var(--rose-ink);letter-spacing:0;transform:translateY(.02em)}
  .frame{width:min(calc(100cqw - 18px), calc((100cqh - 8px) * .75))}
  .arch,.frame-line{-webkit-mask-image:linear-gradient(#000 64%, transparent 100%);mask-image:linear-gradient(#000 64%, transparent 100%)}
  .frame-line{bottom:0}
  .date{display:flex;align-items:center;justify-content:center;gap:.24em;line-height:1;
    margin:calc(var(--fs-date) * -.5) 0 calc(var(--g)*.6);position:relative;z-index:2}
  .date .sep{font-size:.7em;transform:translateY(-.05em)}
  .date .cc{display:inline}
  .place{margin-top:calc(var(--g)*.6)}
  .rule{width:min(34vw, 420px);margin:calc(var(--g)*.9) 0 calc(var(--g)*.8)}
  .foot{margin-top:calc(var(--g)*1.1)}
}
.place .bul{display:none}
@media (orientation:portrait){ .venue{letter-spacing:.06em;margin-right:-.06em;text-wrap:balance} .when{text-wrap:balance} }
@media (orientation:landscape) and (max-height:520px){
  .photo{display:none}
  .card{grid-template-rows:none;grid-auto-rows:auto;align-content:center;grid-template-areas:"eyebrow" "names" "date" "rule" "when" "place" "foot"}
  .date{margin-top:0}
}
@media (max-width:359px){ .label{letter-spacing:.2em;margin-right:-.2em} }

/* ───────────── reveal states ───────────── */
html.js:not(.static):not(.done) .rv{opacity:0}
html.js:not(.static):not(.done) .arch img{opacity:0}
html.glphoto .arch img{opacity:0 !important}
html.static .rv,html.static .arch img{animation:rise 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 110ms + 80ms)}
html.static .arch img{animation-name:fade}
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  html.static .rv,html.static .arch img{animation:fade .7s ease both;animation-delay:0s}
  #gl{transition:none}
}
</style>

      float shape = clamp(.5 - d * uDpr, 0., 1.);
      float fb = uFadeFrac > 0. ? clamp((h - lp.y) / (h * uFadeFrac), 0., 1.) : 1.;

    float rib = 1. - smoothstep(.0, .06, abs(u));
    base = mix(base, base * 1.25 + .05, rib * .5) * (1. + (vein - .5) * .12);

/* GPGPU sim: curl-noise breeze → steering into a slowly turning wreath (portrait) or a floral frame
   around the photograph's arch (landscape) → curtain gust */
const VEL_FRAG = /* glsl */`
uniform float uTime, uDt, uGather, uGust, uD, uWindSpd, uTurn, uBand, uRingDepth, uArc, uProtect, uPad;
uniform vec2 uWindDir, uView, uC, uR; uniform vec4 uInkBox, uArchA; uniform vec2 uArchB;
${SNOISE3}
void main(){
  vec2 uv = gl_FragCoord.xy / resolution.xy;
  vec4 P4 = texture2D(tPos, uv), V4 = texture2D(tVel, uv);
  vec3 p = P4.xyz; float zi = P4.w; vec3 v = V4.xyz; float s = V4.w;
  float h1 = fract(s * 91.731), h2 = fract(s * 47.317), h3 = fract(s * 13.791);
  float h4 = fract(sin(s * 61.17 + 3.1) * 43758.5453), h5 = fract(sin(s * 78.233 + 1.7) * 43758.5453);   // decorrelated from position along the frame
  float L = length(uView);
  vec3 cp = curlNoise(vec3(p.xy / L * 2.1, zi / uD * 1.4 + uTime * .1)) * .28;
  vec3 wind = vec3(uWindDir * uWindSpd * (.8 + .4 * h1), 0.) + cp * uWindSpd * .5;
  wind.z = (zi - p.z) * 1.2 + cp.z * uWindSpd * .06;
  vec2 e, nrm, tng; float zt, keepFrac;
  if (uArc < 0.) {
    // floral frame around the arch: left jamb → up the shoulder → tip under the names | mirror on the right
    float side = s < .5 ? -1. : 1.;
    float u = s < .5 ? s * 2. : (1. - s) * 2.;                                // 0 = jamb end, 1 = tip at the crown
    float R0 = uArchA.z, Ry = uArchB.x, Rm = sqrt((R0 * R0 + Ry * Ry) * .5), jamb = uArchA.y - uArchA.w, arc = Rm * 1.5707963;
    float along = u * (jamb + arc) + sin(uTime * .6 + s * 17.) * 5.;
    if (along < jamb) { e = vec2(uArchA.x + side * R0, uArchA.w + along); nrm = vec2(side, 0.); }
    else { float a = min((along - jamb) / Rm, 1.5707963); e = uArchA.xy + vec2(side * R0 * cos(a), Ry * sin(a)); nrm = normalize(vec2(side * cos(a) / R0, sin(a) / Ry)); }
    tng = vec2(-nrm.y, nrm.x) * side;
    float taper = (.3 + .7 * smoothstep(0., .3, u)) * (1. - .72 * smoothstep(.5, 1., u));    // full at the shoulders, a fine line at the crown
    e += nrm * (h1 * h1 * .9 + .1) * uBand * taper + tng * (h3 - .5) * uBand * .5;
    e.y = min(e.y, uArchB.y);                                                  // never up into the names
    zt = uD * (.02 + .05 * h2 + .07 * (1. - u) * h4);                          // lower jambs lean towards the lens
    keepFrac = .7;
  } else {
    float ang, taper = 1.;
    if (uArc > 6.) ang = s * 6.2831853 + uTime * uTurn;                      // closed oval wreath, slowly turning
    else { float k = s - .5; taper = 1. - .9 * pow(abs(k) * 2., 1.5); ang = -1.5707963 + k * uArc + sin(uTime * .7 + s * 17.) * .025; }
    nrm = vec2(cos(ang), sin(ang)); tng = vec2(-nrm.y, nrm.x);
    e = uC + nrm * (uR + (h1 * h1 * .9 + .1) * uBand * taper);                 // band grows outward only: the names stay clear
    zt = uD * (.025 + .06 * h2 + uRingDepth * (.5 - .5 * sin(ang)));
    keepFrac = uArc > 6. ? 1.01 : .78;
  }
  vec3 target = vec3(e * (uD - zt) / uD, zt);
  vec3 toT = target - p; float dist = length(toT);
  vec3 seek = toT / (dist + .001) * min(dist * 2.3, uWindSpd * 2.3);
  seek += vec3(tng, 0.) * (uArc > 6. ? uTurn * length(uR) * .8 : 0.) + cp * uWindSpd * .07;
  float g = uGather * step(h5, keepFrac);                                      // the rest stays on the breeze
  vec3 desired = mix(wind, seek, g);
  // keep the type clear: slide every petal over/under (or around) the inked lines
  vec2 ps = p.xy * uD / max(uD - p.z, 1.);
  vec2 bc = (uInkBox.xy + uInkBox.zw) * .5, bh = (uInkBox.zw - uInkBox.xy) * .5, dq = ps - bc, dd = abs(dq) - bh;
  float sd = length(max(dd, 0.)) + min(max(dd.x, dd.y), 0.);
  vec2 gr = bh.x > bh.y ? vec2(0., sign(dq.y)) : vec2(sign(dq.x), 0.);      // slide over/under a line, round a column
  if (dd.x > 0. && dd.y > 0.) gr = normalize(dd * sign(dq));
  float rep = max(uGather, uProtect) * (1. - smoothstep(0., uPad * mix(1., .2, g), sd));   // gathered petals may sit close
  desired.xy += gr * rep * uWindSpd * 1.7;
  float side2 = (ps.x - uC.x) + (h2 - .5) * uR.x * .3 >= 0. ? 1. : -1.;      // the curtain parts left | right
  vec3 gust = vec3(side2 * uWindSpd * (1.6 + 1.8 * h1), (h3 - .42) * uWindSpd * 1.05, (h4 - .3) * uD * .2) + cp * uWindSpd * .7;
  desired = mix(desired, gust, uGust);
  float k = mix(1.5, 6.2, g * (1. - uGust)) + uGust * 2.6;
  k = max(k, 7. * rep * (1. - uGust));
  v += (desired - v) * (1. - exp(-uDt * k));
  gl_FragColor = vec4(v, s);
}`;
const POS_FRAG = /* glsl */`
uniform float uDt;
void main(){ vec2 uv = gl_FragCoord.xy / resolution.xy; vec4 P = texture2D(tPos, uv); P.xyz += texture2D(tVel, uv).xyz * uDt; gl_FragColor = P; }`;

/* ─────────── boot ─────────── */
async function main() {
const canvas = document.getElementById('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance', stencil: false, depth: false });
  if (!renderer.capabilities.isWebGL2) throw new Error('WebGL2 required');
} catch (e) { throw e; }

renderer.setClearColor(0xF4ECE1, 1);
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); de.classList.remove('glphoto'); canvas.classList.remove('on'); STD.reveal('context-lost'); finishDOM(); running = false; });

const PAPER = hex(CFG.palette.paper);
const fsGeo = new THREE.BufferGeometry();
fsGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
function fsMesh(mat) { const m = new THREE.Mesh(fsGeo, mat); m.frustumCulled = false; return m; }

/* load: photo texture + fonts */
const photoTex = await new Promise(res => {
  new THREE.TextureLoader().load(CFG.photo.src, t => res(t), undefined, () => res(null));
});
if (photoTex) {
  photoTex.generateMipmaps = true; photoTex.minFilter = THREE.LinearMipmapLinearFilter; photoTex.magFilter = THREE.LinearFilter;
  photoTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
}
await Promise.race([
  Promise.all([
    document.fonts.load('500 40px "Bodoni Moda"'), document.fonts.load('400 80px "Bodoni Moda"'), document.fonts.load('600 20px "Bodoni Moda"'),
    document.fonts.load('400 40px "Pinyon Script"'), document.fonts.load('500 12px "Jost"'), document.fonts.load('italic 500 16px "Cormorant Garamond"'),
  ]).then(() => document.fonts.ready), sleep(3000)]);
await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

const doIntro = !STD.revealed && !SKIP && !STD.skipReq;
STD.started = true;

/* ─────────── layout measurement ─────────── */
let W = innerWidth, H = innerHeight, D = 1, camera;
const petalSize = () => Math.min(36, Math.max(20, Math.min(W, H) * .046));
const L = {};
function measure() {
  W = innerWidth; H = innerHeight;
  const arch = document.getElementById('arch').getBoundingClientRect();
  L.photo = arch.width > 4 && arch.height > 4 ? arch : null;
  L.landscape = isLandscape();
  L.inkEls = ['names', 'date'].map(id => document.getElementById(id));
  const rs = L.inkEls.map(el => el.getBoundingClientRect());
  const u = rs.reduce((a, r) => ({ l: Math.min(a.l, r.left), t: Math.min(a.t, r.top), r: Math.max(a.r, r.right), b: Math.max(a.b, r.bottom) }), { l: 1e9, t: 1e9, r: -1e9, b: -1e9 });
  L.ink = u;
  // wreath: the smallest ellipse that clears every glyph box (with a petal of air) and stays on screen
  const a = (u.r - u.l) / 2, b = (u.b - u.t) / 2, petal = Math.max(18, Math.min(W, H) * .045);
  const band = petalSize() * 1.2, cx = (u.l + u.r) / 2, cyBox = (u.t + u.b) / 2;
  let Rx, Ry, cy = cyBox;
  {                                                     // a closed wreath around the names and the date
    const m = petal * .5, edge = petal * .55 + band;
    const corners = rs.flatMap(r => [[r.left, r.top], [r.right, r.top], [r.left, r.bottom], [r.right, r.bottom]]);
    let best = null;
    for (let rx = a + m * 1.6; rx <= W / 2 - petal - band; rx += 3) {
      for (let off = -.4; off <= .401; off += .05) {
        const c = cyBox + off * b;
        let ry = 0;
        for (const [x, y] of corners) {
          const dx = Math.abs(x - cx) + m, dy = Math.abs(y - c) + m * .4;
          if (dx >= rx * .985) { ry = Infinity; break; }
          ry = Math.max(ry, dy / Math.sqrt(1 - (dx / rx) ** 2));
        }
        if (c - ry - edge < petal * .4 || c + ry + edge > H - petal * .4) continue;
        if (!best || rx + ry < best[0] + best[1]) best = [rx, ry, c];
      }
    }
    if (best) [Rx, Ry, cy] = best;
    else { Rx = W / 2 - petal * .7 - band * .6; Ry = Math.min(b * 1.5 + petal, cyBox - edge, H - cyBox - edge); }
  }
  L.wc = new THREE.Vector2(cx - W / 2, H / 2 - cy);
  L.wr = new THREE.Vector2(Rx, Ry);
  L.inkBox = new THREE.Vector4(u.l - W / 2, H / 2 - u.b, u.r - W / 2, H / 2 - u.t);   // world: x right, y up
  L.archMode = false;                                   // the wreath frames the text, not the arch
  if (L.archMode) {                                     // floral frame around the photograph's arch, at the visual centre
    const p = L.photo, r = p.width / 2, ax = p.left + r - W / 2, yT = H / 2 - p.top, cyc = yT - r;
    const R0 = r + 8 + petal * .5, yEnd = yT - p.height * .6;
    const limitY = L.inkBox.y - petal * .55;            // the crown runs just under the names (their box has air below the baseline)
    L.archBand = petalSize() * 1.7;
    const Ry = Math.max(r * .8, Math.min(R0, limitY - cyc - L.archBand * .26));   // a touch elliptical only if the names sit close
    L.arch = new THREE.Vector4(ax, cyc, R0, yEnd);

  L.txt = [...document.querySelectorAll(L.landscape ? '.eyebrow,#names,#date,.when,.place,.rule,.foot' : '.eyebrow,.n1,#date,.n2,.when,.place,.rule,.foot')]
    .map(el => el.getBoundingClientRect()).filter(r => r.width > 0).slice(0, 9);
  // text keep-out zones for ambient petals
  L.keep = [...document.querySelectorAll('.eyebrow,.n1,.n2,.amp,#date,.when,.place,.foot,.rule')]
    .map(el => el.getBoundingClientRect()).filter(r => r.width > 0)
    .map(r => ({ l: r.left - W / 2 - 14, r: r.right - W / 2 + 14, t: H / 2 - r.top + 12, b: H / 2 - r.bottom - 12 }));
  if (!L.landscape && L.photo) {                        // portrait: the print fills the width — petals never drift over it
    const p = L.photo; L.keep.push({ l: p.left - W / 2 + 6, r: p.right - W / 2 - 6, t: H / 2 - p.top - 6, b: H / 2 - p.bottom + 6 });
  }
}
/* the intro starts with the names and the date together in the middle of the screen, inside the wreath;
   as the petals part they glide to their places on the card (names under the eyebrow, date on the print) */
const CL = { els: [], on: false, moved: false };
function applyCluster(p) {
  for (const c of CL.els) {
    const k = 1 - p;
    c.el.style.transformOrigin = '50% 50%';
    c.el.style.transform = p >= 1 ? '' : `translate3d(${(c.dx * k).toFixed(2)}px,${(c.dy * k).toFixed(2)}px,0) scale(${(c.s + (1 - c.s) * p).toFixed(4)})`;
  }
}
function clusterText() {
  const nEl = document.getElementById('names'), dEl = document.getElementById('date');
  const rN = nEl.getBoundingClientRect(), rD = dEl.getBoundingClientRect();
  if (!rN.width || !rD.width) return;
  const W0 = innerWidth, H0 = innerHeight, gap = rN.height * .3;
  // small enough to sit inside the wreath (phones), never larger than the card
  const s = Math.min(1, (W0 < 700 ? .55 : .5) * W0 / Math.max(rN.width, rD.width), .4 * H0 / (rN.height + gap + rD.height));
  const top = H0 * .47 - (rN.height + gap + rD.height) * s / 2;
  CL.els = [
    { el: nEl, dx: W0 / 2 - (rN.left + rN.width / 2), dy: top + rN.height * s / 2 - (rN.top + rN.height / 2), s },
    { el: dEl, dx: W0 / 2 - (rD.left + rD.width / 2), dy: top + (rN.height + gap) * s + rD.height * s / 2 - (rD.top + rD.height / 2), s },
  ];

}
if (doIntro) clusterText();
measure();

/* ─────────── renderer + camera ─────────── */
let dpr = doIntro ? DPR_INTRO : DPR_AMB;
renderer.setPixelRatio(dpr); renderer.setSize(W, H, false);
camera = new THREE.PerspectiveCamera(30, W / H, 1, 20000);
function placeCamera() {
  D = (H / 2) / Math.tan(THREE.MathUtils.degToRad(15));
  camera.aspect = W / H; camera.position.set(0, 0, D); camera.near = 10; camera.far = D * 3; camera.lookAt(0, 0, 0); camera.updateProjectionMatrix();
}
placeCamera();

/* paper (static) + dapple (animated, low-res) */
const paperRT = new THREE.WebGLRenderTarget(4, 4, { depthBuffer: false });
const paperMat = new THREE.ShaderMaterial({ vertexShader: FS_VERT, fragmentShader: PAPER_FRAG, uniforms: { uResPx: { value: new THREE.Vector2() }, uDpr: { value: 1 }, uPaper: { value: PAPER } }, depthTest: false, depthWrite: false });
const paperScene = new THREE.Scene(); paperScene.add(fsMesh(paperMat));
const dappleRT = new THREE.WebGLRenderTarget(4, 4, { depthBuffer: false, type: THREE.UnsignedByteType });
const dappleMat = new THREE.ShaderMaterial({ vertexShader: FS_VERT, fragmentShader: DAPPLE_FRAG, depthTest: false, depthWrite: false,
  uniforms: { uSize: { value: new THREE.Vector2() }, uScale: { value: 3 }, uTime: { value: 0 }, uUnit: { value: 800 },
    uTxt: { value: Array.from({ length: 9 }, () => new THREE.Vector4()) }, uMask: { value: 1 }, uFall: { value: 120 } } });
const dappleScene = new THREE.Scene(); dappleScene.add(fsMesh(dappleMat));
function bakePaper() {
  const pr = DPR_AMB, w = Math.ceil(W * pr), h = Math.ceil(H * pr);
  paperRT.setSize(w, h);
  paperMat.uniforms.uResPx.value.set(w, h); paperMat.uniforms.uDpr.value = pr;
  renderer.setRenderTarget(paperRT); renderer.render(paperScene, orthoCam); renderer.setRenderTarget(null);
  const dw = Math.max(8, Math.ceil(W / 3)), dh = Math.max(8, Math.ceil(H / 3)), DU = dappleMat.uniforms;
  dappleRT.setSize(dw, dh); DU.uSize.value.set(dw, dh); DU.uScale.value = W / dw; DU.uUnit.value = Math.min(W, H);
  DU.uFall.value = Math.max(40, Math.min(120, Math.min(W, H) * .12));
  DU.uTxt.value.forEach((v, i) => { const r = L.txt[i]; if (r) v.set(r.left - 6, r.top - 6, r.right + 6, r.bottom + 6); else v.set(0, 0, 0, 0); });
}
function renderDapple(t) {
  dappleMat.uniforms.uTime.value = t;
  renderer.setRenderTarget(dappleRT); renderer.render(dappleScene, orthoCam); renderer.setRenderTarget(null);
}
bakePaper();

/* ink texture: the names, drawn glyph-by-glyph at their exact laid-out positions */
const blankTex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1); blankTex.needsUpdate = true;
let inkTex = null;
function buildInk() {
  const pad = 26, pr = Math.min(devicePixelRatio || 1, 2);
  const u = L.ink, x0 = Math.floor((u.l - pad) * pr) / pr, y0 = Math.floor((u.t - pad) * pr) / pr;   // texel grid = device-pixel grid
  const cv = document.createElement('canvas'); cv.width = Math.ceil((u.r + pad - x0) * pr); cv.height = Math.ceil((u.b + pad - y0) * pr);

  ctx.textBaseline = 'alphabetic';
  const range = document.createRange();
  for (const el of L.inkEls) {
    const sc = el.getBoundingClientRect().width / (el.offsetWidth || 1);   // the intro scales the text down on phones
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const parent = node.parentElement, cs = getComputedStyle(parent);
      if (cs.display === 'none' || parent.closest('.sr')) continue;
      const fs = parseFloat(cs.fontSize) * sc, om = /"opsz"\s+([\d.]+)/.exec(cs.fontVariationSettings || ''), drawFs = om ? parseFloat(om[1]) : fs, k = fs / drawFs;
      ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${drawFs}px ${cs.fontFamily}`;   // canvas uses auto optical sizing: draw at the pinned opsz, scale up
      ctx.fillStyle = cs.color;
      const asc = ctx.measureText('H').fontBoundingBoxAscent * k;
      const txt = node.textContent, upper = cs.textTransform === 'uppercase';
      for (let i = 0; i < txt.length; i++) {
        const ch = txt[i]; if (/\s/.test(ch)) continue;
        range.setStart(node, i); range.setEnd(node, i + 1);
        const r = range.getClientRects()[0]; if (!r || r.width === 0) continue;

const comp = new THREE.ShaderMaterial({
  vertexShader: FS_VERT, fragmentShader: COMP_FRAG, depthTest: false, depthWrite: false,
  uniforms: {
    tPaper: { value: paperRT.texture }, tDapple: { value: dappleRT.texture }, tPhoto: { value: photoTex || blankTex }, tInk: { value: blankTex },
    uResPx: { value: new THREE.Vector2() }, uDpr: { value: dpr }, uTime: { value: 0 }, uDap: { value: .045 }, uGrain: { value: .026 }, uVig: { value: .035 }, uPaper: { value: PAPER },
    uPhotoRect: { value: new THREE.Vector4() }, uImg: { value: new THREE.Vector2(CFG.photo.w, CFG.photo.h) },
    uCrop: { value: new THREE.Vector3(CFG.photo.focus[0], CFG.photo.focus[1], CFG.photo.zoom) },
    uReveal: { value: 0 }, uFadeFrac: { value: 0 }, uPhotoOn: { value: photoTex ? 1 : 0 },
    uPtr: { value: new THREE.Vector3(-999, -999, 0) }, uBreeze: { value: 0 },
    uInkRect: { value: new THREE.Vector4() }, uInk: { value: 0 }, uInkOn: { value: 0 }, uInkDir: { value: 0 }, uInkGamma: { value: (devicePixelRatio || 1) < 1.5 ? 2.1 : 1.6 },
  }
});
function syncLayoutUniforms() {
  const pr = renderer.getPixelRatio();
  comp.uniforms.uResPx.value.set(Math.round(W * pr), Math.round(H * pr)); comp.uniforms.uDpr.value = pr;
  if (L.photo) comp.uniforms.uPhotoRect.value.set(L.photo.left, L.photo.top, L.photo.width, L.photo.height);
  comp.uniforms.uPhotoOn.value = photoTex && L.photo ? 1 : 0;
  comp.uniforms.uFadeFrac.value = .36;
  const z = parseFloat(getComputedStyle(document.getElementById('photo')).getPropertyValue('--zoom')) || CFG.photo.zoom;

syncLayoutUniforms();

const scene = new THREE.Scene();
const bg = fsMesh(comp); bg.renderOrder = -10; scene.add(bg);

/* petal assets */
function veinTexture() {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 256;
  const g = cv.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0, 0, 128, 256);
  const rnd = mulberry(7);
  g.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 46; i++) {
    const tx = rnd() * 128, k = (tx - 64) / 64;
    g.strokeStyle = `rgba(255,255,255,${.10 + rnd() * .16})`; g.lineWidth = .6 + rnd() * 1.1;
    g.beginPath(); g.moveTo(64 + k * 6, 256); g.quadraticCurveTo(64 + k * 40 + (rnd() - .5) * 18, 150, tx, -4); g.stroke();
  }
  const out = document.createElement('canvas'); out.width = 128; out.height = 256;
  const o = out.getContext('2d'); o.filter = 'blur(1.2px)'; o.drawImage(cv, 0, 0);
  const t = new THREE.CanvasTexture(out); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t;
}
const veinTex = veinTexture();
function petalBaseGeometry() {
  const segU = 10, segV = 12, pos = [], idx = [];
  for (let j = 0; j <= segV; j++) for (let i = 0; i <= segU; i++) pos.push(-1.45 + 2.9 * i / segU, -.24 + 1.48 * j / segV, 0);
  for (let j = 0; j < segV; j++) for (let i = 0; i < segU; i++) { const a = j * (segU + 1) + i, b = a + 1, c = a + segU + 1, d = c + 1; idx.push(a, b, d, a, d, c); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); return g;
}
const baseGeo = petalBaseGeometry();
const PALETTE = [ // colour, weight, kind
  ['#C8697F', .28, 0], ['#DC98A0', .22, 0], ['#E5B1B1', .08, 0], ['#DE7849', .13, 0], ['#E4906B', .10, 0], ['#EFD3C6', .07, 0], ['#748A4E', .07, 1], ['#5E7343', .05, 1],
];
function pickColour(r) { let acc = 0; for (const p of PALETTE) { acc += p[1]; if (r <= acc) return p; } return PALETTE[0]; }
const L_DIR = new THREE.Vector3(-.55, .62, .56).normalize();

function makePetalMaterial(defines, extra = {}) {
  return new THREE.ShaderMaterial({
    vertexShader: PETAL_VERT, fragmentShader: PETAL_FRAG, defines, transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
    uniforms: Object.assign({
      uTime: { value: 0 }, uSettle: { value: 0 }, uD: { value: D }, uFocusZ: { value: D * .05 }, uCocK: { value: 30 / D }, uTumble: { value: 1 },
      uC: { value: L.wc }, uShadowDir: { value: new THREE.Vector2(.11, -.14) }, uL: { value: L_DIR }, tVein: { value: veinTex }, uAlpha: { value: 1 },
      uProtect: { value: 0 }, uInkBox: { value: L.inkBox }, uShAmt: { value: 0 },
    }, extra),
  });
}
function instanceGeometry(n, rnd, zFn) {
  const g = new THREE.InstancedBufferGeometry();
  g.index = baseGeo.index; g.setAttribute('position', baseGeo.attributes.position);
  const seed = new Float32Array(n * 4), col = new Float32Array(n * 3), size = new Float32Array(n), kind = new Float32Array(n);
  const base = petalSize();
  for (let i = 0; i < n; i++) {
    seed.set([rnd(), rnd(), rnd(), rnd()], i * 4);
    const p = pickColour(rnd()); const c = hex(p[0]); const j = 1 + (rnd() - .5) * .08;
    col.set([Math.min(1, c.x * j), Math.min(1, c.y * j), Math.min(1, c.z * j)], i * 3);
    kind[i] = p[2]; size[i] = base * (.78 + rnd() * .5) * (p[2] ? 1.3 : 1);

  g.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seed, 4));
  g.setAttribute('aColor', new THREE.InstancedBufferAttribute(col, 3));

}

/* ─────────── intro system (GPGPU) ─────────── */
let intro = null;
function buildIntro() {
  const N = SIM * SIM, rnd = mulberry(20270320);
  const gpu = new GPUComputationRenderer(SIM, SIM, renderer);
  if (!renderer.extensions.has('EXT_color_buffer_float')) gpu.setDataType(THREE.HalfFloatType);
  const p0 = gpu.createTexture(), v0 = gpu.createTexture();
  const diag = Math.hypot(W, H), windSpd = diag * .45;
  const wa = L.landscape ? .1 : -.36, wd = new THREE.Vector2(Math.cos(wa), Math.sin(wa));
  const zs = [];
  for (let i = 0; i < N; i++) zs.push(D * (.012 + .6 * Math.pow((i + rnd()) / N, 2.3)));  // sorted far → near (painter's order)
  for (let i = 0; i < N; i++) {
    const zi = zs[i];
    const sx = L.wc.x + (rnd() - .5) * Math.min(W, L.wr.x * 2.6), sy = THREE.MathUtils.lerp((rnd() - .5) * H * .95, L.wc.y, .3);
    const up = diag * (.3 + .9 * rnd());
    const px = sx - wd.x * up + (rnd() - .5) * 40, py = sy - wd.y * up;
    const k = (D - zi) / D;
    p0.image.data.set([px * k, py * k, zi, zi], i * 4);
    const sp = windSpd * (.8 + .4 * rnd());
    v0.image.data.set([wd.x * sp, wd.y * sp, 0, rnd()], i * 4);
  }
  const velVar = gpu.addVariable('tVel', VEL_FRAG, v0);
  const posVar = gpu.addVariable('tPos', POS_FRAG, p0);
  gpu.setVariableDependencies(velVar, [posVar, velVar]);
  gpu.setVariableDependencies(posVar, [posVar, velVar]);
  Object.assign(velVar.material.uniforms, {
    uTime: { value: 0 }, uDt: { value: 1 / 60 }, uGather: { value: 0 }, uGust: { value: 0 }, uD: { value: D }, uWindSpd: { value: windSpd }, uTurn: { value: .11 },
    uWindDir: { value: wd }, uView: { value: new THREE.Vector2(W, H) }, uC: { value: L.wc }, uR: { value: L.wr },
    uBand: { value: L.archMode ? L.archBand : petalSize() * (L.landscape ? 1.25 : 1.15) }, uRingDepth: { value: L.landscape ? .14 : .10 },
    uArc: { value: L.archMode ? -1 : 7 },
    uProtect: { value: 0 }, uPad: { value: petalSize() * 2.2 }, uInkBox: { value: L.inkBox },
    uArchA: { value: L.arch || new THREE.Vector4() }, uArchB: { value: L.archB || new THREE.Vector2(1, 1e5) },
  });
  posVar.material.uniforms.uDt = { value: 1 / 60 };
  const err = gpu.init(); if (err) throw new Error(err);

  const geo = instanceGeometry(N, rnd);
  const ref = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) ref.set([((i % SIM) + .5) / SIM, (Math.floor(i / SIM) + .5) / SIM], i * 2);
  geo.setAttribute('aRef', new THREE.InstancedBufferAttribute(ref, 2));
  const mat = makePetalMaterial({ GPGPU: '' }, { tPos: { value: null } });
  const shMat = makePetalMaterial({ GPGPU: '', SHADOW: '' }, { tPos: { value: null } });
  const mesh = new THREE.Mesh(geo, mat); mesh.frustumCulled = false; mesh.renderOrder = 2;
  const shadow = new THREE.Mesh(geo, shMat); shadow.frustumCulled = false; shadow.renderOrder = 1;
  scene.add(shadow, mesh);

  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(dpr); composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, camera));
  let bloom = null;
  if (TIER !== 'low') { bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .5, .55, 1.0); bloom.threshold = 1.0; composer.addPass(bloom); }
  composer.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null } }, vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }', fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ gl_FragColor = vec4(clamp(texture2D(tDiffuse, vUv).rgb, 0., 1.), 1.); }' }));

  let simT = 0;
  function step() {
    const t = simT, U = velVar.material.uniforms;
    U.uTime.value = t;
    U.uGather.value = inOut(seg(t, ...TL.gather));
    U.uGust.value = sstep(...TL.gust, t);
    U.uProtect.value = sstep(...TL.protect, t);
    gpu.compute(); simT += 1 / 60;
  }
  function sync(t) {
    const tex = gpu.getCurrentRenderTarget(posVar).texture;
    for (const m of [mat, shMat]) {
      m.uniforms.tPos.value = tex; m.uniforms.uTime.value = t;
      m.uniforms.uSettle.value = sstep(...TL.settle, t) * (1 - sstep(3.25, 3.6, t));
      m.uniforms.uProtect.value = sstep(...TL.protect, t);
      m.uniforms.uShAmt.value = sstep(...TL.settle, t);

    if (bloom) bloom.strength = .38 * sstep(.2, .9, t) * (1 - sstep(4.3, 5.3, t));
  }
  function dispose() {
    scene.remove(mesh, shadow); geo.dispose(); mat.dispose(); shMat.dispose();
    for (const v of gpu.variables) { v.renderTargets.forEach(rt => rt.dispose()); v.material.dispose(); }
    gpu.dispose?.(); composer.renderTarget1.dispose(); composer.renderTarget2.dispose(); bloom?.dispose();
  }

}

/* ─────────── ambient system (CPU, cheap) ─────────── */
let amb = null;
function buildAmbient(startT) {
  const n = AMB_COUNT, rnd = mulberry(314);
  const zf = i => (W < 600 || i < n - 3) ? D * (.02 + .1 * rnd()) : D * (.24 + .2 * rnd());   // phones: only far, sharp petals
  const geo = instanceGeometry(n, rnd);
  if (W < 600) geo.attributes.aSize.array.forEach((v, i, arr) => { arr[i] = v * 1.2; });
  const pos = new Float32Array(n * 3), fade = new Float32Array(n);
  const pA = new THREE.InstancedBufferAttribute(pos, 3), fA = new THREE.InstancedBufferAttribute(fade, 1);
  pA.setUsage(THREE.DynamicDrawUsage); fA.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aPos', pA); geo.setAttribute('aFade', fA);
  const ps = [];
  const spawnY = () => {                                       // portrait: drift through the type band, beside the lines
    if (L.landscape || !L.photo || rnd() < .2) return (rnd() - .35) * H;
    const top = H / 2 - L.photo.bottom - 10, bot = -H / 2 + 30; return bot + rnd() * Math.max(0, top - bot);
  };
  for (let i = 0; i < n; i++) ps.push({ z: zf(i), x: (rnd() - .62) * W, y: spawnY(), vx: W * (.022 + .02 * rnd()) + 6, vy: -H * (.004 + .01 * rnd()), ph: rnd() * 6.28, born: rnd() * 1.5, a: 0 });
  ps.sort((a, b) => a.z - b.z);
  const mat = makePetalMaterial({}, {}); mat.uniforms.uTumble.value = .32;
  const shMat = makePetalMaterial({ SHADOW: '' }, {}); shMat.uniforms.uTumble.value = .32;
  const mesh = new THREE.Mesh(geo, mat); mesh.frustumCulled = false; mesh.renderOrder = 2;
  const shadow = new THREE.Mesh(geo, shMat); shadow.frustumCulled = false; shadow.renderOrder = 1;
  scene.add(shadow, mesh);
  const sdRect = (x, y, k) => { const dx = Math.max(k.l - x, 0, x - k.r), dy = Math.max(k.b - y, 0, y - k.t); const inside = x > k.l && x < k.r && y > k.b && y < k.t; return inside ? -Math.min(x - k.l, k.r - x, k.t - y, y - k.b) : Math.hypot(dx, dy); };
  let last = startT;
  function update(t) {
    const dt = Math.min(.1, Math.max(0, t - last)); last = t;
    const base = petalSize() * (W < 600 ? 1.2 : 1);
    ps.forEach((p, i) => {
      p.x += (p.vx + Math.sin(t * .55 + p.ph) * 10) * dt;
      p.y += (p.vy + Math.cos(t * .42 + p.ph * 1.3) * 7) * dt;
      const mag = D / (D - p.z), mx = W / 2 + base * mag * .9 + 10;
      if (p.x > mx || p.y < -H / 2 - base * mag) { p.x = -mx - rnd() * W * .15; p.y = spawnY(); p.a = 0; p.born = t; }
      const rad = base * mag * .55 + Math.abs(p.z - D * .05) * 30 / D;
      let d = 1e9; for (const k of L.keep) d = Math.min(d, sdRect(p.x, p.y, k));
      const target = clamp01((d - rad) / 46) * clamp01((t - p.born) / 1.6);
      p.a += (target - p.a) * Math.min(1, dt * 4);
      const k = (D - p.z) / D;
      pos[i * 3] = p.x * k; pos[i * 3 + 1] = p.y * k; pos[i * 3 + 2] = p.z; fade[i] = p.a;
    });

    mat.uniforms.uTime.value = t; shMat.uniforms.uTime.value = t;
  }
  function relayout() { for (const m of [mat, shMat]) { m.uniforms.uD.value = D; m.uniforms.uFocusZ.value = D * .05; m.uniforms.uCocK.value = 30 / D; } }
  return { update, relayout, ps };
}

/* ─────────── DOM choreography (pure function of t → deterministic for ?t=) ─────────── */
const domEls = DOM_TL.map(([sel, s, d, mode]) => ({ els: [...document.querySelectorAll(sel)], s, d, mode }));
const namesEls = ['n1', 'n2', 'date'].map(id => document.getElementById(id));
let skipAt = null;
function applyDOM(t, sinceSkip) {
  for (const it of domEls) {
    let e = outCubic(seg(t, it.s, it.s + it.d));
    if (sinceSkip != null) e = Math.max(e, outCubic(seg(sinceSkip, 0, .55)));
    for (const el of it.els) {
      el.style.opacity = e.toFixed(3);
      if (it.mode !== 'fade') { el.style.transform = e < 1 ? `translate3d(0,${((1 - e) * 10).toFixed(2)}px,0)` : ''; el.style.filter = e < 1 ? `blur(${((1 - e) * 5).toFixed(2)}px)` : ''; }
    }
  }
  let n = sstep(...TL.namesHTML, t);
  if (sinceSkip != null) n = Math.max(n, seg(sinceSkip, 0, .4));
  for (const el of namesEls) el.style.opacity = n.toFixed(3);
  if (CL.on) {
    let m = inOut(seg(t, ...TL.move));
    if (sinceSkip != null) m = Math.max(m, outCubic(seg(sinceSkip, 0, .55)));
    applyCluster(m);
  }
}
function finishDOM() {
  if (CL.on) { applyCluster(1); CL.on = false; CL.moved = true; }
  document.querySelectorAll('.rv').forEach(el => { el.style.opacity = ''; el.style.transform = ''; el.style.filter = ''; });
  de.classList.add('done');
}

/* ─────────── pointer (wind ripple on the photograph) ─────────── */
const ptr = { x: -999, y: -999, s: 0, target: 0, lastMove: 0 };
addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.lastMove = performance.now(); ptr.target = 1; }, { passive: true });
addEventListener('pointerdown', e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.lastMove = performance.now(); ptr.target = 1; }, { passive: true });

/* ─────────── skip ─────────── */
const skipBtn = document.getElementById('skip');
function requestSkip() { if (mode === 'intro' && skipAt == null && T_FREEZE == null) skipAt = performance.now(); }
skipBtn.addEventListener('click', e => { e.stopPropagation(); requestSkip(); });
addEventListener('pointerdown', e => { if (mode === 'intro' && !e.target.closest('a')) requestSkip(); });
addEventListener('keydown', e => { if (mode === 'intro' && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')) { if (e.key === ' ') e.preventDefault(); requestSkip(); } });

/* ─────────── main loop ─────────── */
let mode = 'intro', running = true, ambT0 = 0, pendingRelayout = false;
function toAmbient(now) {
  if (intro) { intro.dispose(); intro = null; }
  inkTex?.dispose(); inkTex = null; comp.uniforms.tInk.value = blankTex; comp.uniforms.uInkOn.value = 0;
  comp.uniforms.uReveal.value = 1; comp.uniforms.uDap.value = .015; comp.uniforms.uBreeze.value = 1; dappleMat.uniforms.uMask.value = 1;
  skipBtn.classList.remove('on'); skipBtn.setAttribute('tabindex', '-1');
  finishDOM();
  if (CL.moved) { CL.moved = false; measure(); bakePaper(); syncLayoutUniforms(); }   // the text is in its final places now
  if (dpr !== DPR_AMB) { dpr = DPR_AMB; renderer.setPixelRatio(dpr); renderer.setSize(W, H, false); syncLayoutUniforms(); }
  mode = 'ambient';
  ambT0 = now;
  amb = buildAmbient(0);
  if (pendingRelayout) { pendingRelayout = false; relayout(); }
  STD.metrics();
}

function frameIntro(now) {
  let t;
  if (T_FREEZE != null) t = T_FREEZE;
  else {
    const target = (now - introStart) / 1000;
    let steps = 0;
    while (intro.simT < target && steps < 6) { intro.step(); steps++; }
    if (intro.simT < target - .25) introStart += (target - intro.simT) * 1000; // never spiral: slow the clock instead of skipping beats
    t = intro.simT;
  }
  const since = skipAt != null ? (now - skipAt) / 1000 : null;
  const U = comp.uniforms;
  U.uTime.value = t;
  U.uDap.value = .045 - .03 * sstep(2.6, 4.6, t);
  dappleMat.uniforms.uMask.value = sstep(1.5, 2.3, t);
  U.uInk.value = Math.max(outCubic(seg(t, ...TL.ink)), since != null ? seg(since, 0, .35) : 0);
  U.uInkOn.value = t < TL.inkOff && (since == null || since < .45) ? 1 : 0;
  U.uReveal.value = Math.max(inOut(seg(t, ...TL.reveal)), since != null ? inOut(seg(since, 0, .8)) : 0);
  U.uBreeze.value = sstep(4.6, 5.6, t);
  intro.sync(t);
  const pa = since != null ? 1 - sstep(0, .6, since) : 1;
  intro.mat.uniforms.uAlpha.value = pa; intro.shMat.uniforms.uAlpha.value = pa;
  renderDapple(dappleTime(t));
  applyDOM(t, since);
  const skOn = t > .25 && t < 3.3 && since == null && T_FREEZE == null;
  if (skOn !== skipBtn.classList.contains('on')) { skipBtn.classList.toggle('on', skOn); skipBtn.tabIndex = skOn ? 0 : -1; }
  intro.composer.render();
  if (T_FREEZE == null && (t >= TL.end || (since != null && since > .85))) toAmbient(now);
}

let lastAmb = 0;
function frameAmbient(now) {
  const idle = now - ptr.lastMove > 1000 && ptr.s < .02;
  if (now - lastAmb < (idle ? 1000 / 24 : 1000 / 30) - 2) return;   // the card is calm: 30fps, 24fps (grain cadence) when idle
  lastAmb = now;
  const t = T_FREEZE != null ? Math.max(0, T_FREEZE - TL.end) + (now - ambT0) * 0 : (now - ambT0) / 1000;
  const tt = TL.end + t;
  ptr.target = now - ptr.lastMove < 900 ? 1 : 0;
  ptr.s += (ptr.target - ptr.s) * .06;
  const U = comp.uniforms;
  U.uTime.value = tt; U.uPtr.value.set(ptr.x, ptr.y, ptr.s);
  renderDapple(dappleTime(tt));
  amb.update(t);
  renderer.render(scene, camera);
}

let introStart = 0, frozenFrames = 0;
const dappleTime = t => t < TL.end ? t : TL.end + (t - TL.end) * .6;
function loop(now) {
  if (!running) return;
  if (mode === 'intro') frameIntro(now); else frameAmbient(now);
  if (T_FREEZE != null && ++frozenFrames > 3) { de.dataset.frozen = '1'; return; }   // ?t= : a still frame — stop drawing
  requestAnimationFrame(loop);
}

/* visibility: pause everything when hidden */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; }
  else if (!running) { running = true; const n = performance.now(); if (mode === 'intro') introStart = n - intro.simT * 1000; lastAmb = 0; requestAnimationFrame(loop); }
});
let pauseT = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseT = performance.now(); else if (mode === 'ambient') ambT0 += performance.now() - pauseT; });

/* resize: finish the intro immediately, then re-measure */
let rzT = 0;
function relayout() { measure(); placeCamera(); renderer.setSize(W, H, false); bakePaper(); syncLayoutUniforms(); amb?.relayout(); STD.metrics(); }
addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    if (mode === 'intro') {
      // a mobile toolbar settling (same width, small height change) must not cancel the intro: the card is svh-based and doesn't move
      if (Math.abs(innerWidth - W) < 2 && Math.abs(innerHeight - H) < 140) { pendingRelayout = true; return; }
      toAmbient(performance.now());
    }
    relayout();
  }, 120);
});

if (Q.has('debug')) window.__fl = { L, get amb() { return amb; }, get D() { return D; }, TIER };
/* ─────────── go ─────────── */

de.classList.add('gl');
if (photoTex && L.photo && doIntro) de.classList.add('glphoto');
try {
  if (doIntro) {
    buildInk();
    intro = buildIntro();
    if (T_FREEZE != null) { while (intro.simT < Math.min(T_FREEZE, TL.end) - 1e-6) intro.step(); }
    if (T_FREEZE != null && T_FREEZE >= TL.end) { toAmbient(performance.now()); }
    introStart = performance.now();
  } else {
    toAmbient(performance.now());
  }
} catch (e) {
  console.warn('[std] intro unavailable:', e.message);
  intro = null; toAmbient(performance.now());
}
// first frame, then fade the GL layer in over the identical CSS paper
requestAnimationFrame(now => {
  loop(now); canvas.classList.add('on'); STD.metrics();
  if (photoTex && L.photo && !doIntro) setTimeout(() => de.classList.add('glphoto'), 760); // GL photo is pixel-matched: swap after the fade
});
}
if (!STD.reduced) main().catch(e => {
  console.warn('[std] WebGL unavailable — showing the HTML card:', e && e.message); de.dataset.err = String(e && e.stack || e);
  STD.started = false; document.querySelectorAll('#names,#date').forEach(el => { el.style.transform = ''; });
  document.getElementById('gl').classList.remove('on'); de.classList.remove('glphoto', 'gl'); STD.reveal('error');
});
</script>
</body>
</html>
